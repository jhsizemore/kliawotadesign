<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Odyssey email preferences</title><style>body{max-width:680px;margin:70px auto;padding:0 24px;background:#f2ecdf;color:#20352e;font:16px/1.7 system-ui}h1{font:44px Georgia}button{padding:13px 20px;background:#20352e;color:#fff;border:0;font:16px system-ui}a{color:inherit}</style></head><body><a href="../">← Odyssey</a><h1>Email preferences</h1><p>Use the button below to stop all Odyssey email updates. Opening this link alone does not unsubscribe you.</p><button id="unsubscribe" type="button">Unsubscribe from Odyssey updates</button><p id="status" role="status"></p><p>For other changes, contact <a href="mailto:jhsizemore@gmail.com?subject=Odyssey%20email%20preferences">Hunter</a>.</p><script>
(function(){const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const button=document.getElementById('unsubscribe'),status=document.getElementById('status');if(!/^[a-f0-9]{64}\.[a-f0-9]{64}$/.test(token)){button.disabled=true;status.textContent='Open the preferences link from your Odyssey update email, or contact Hunter.';return;}button.onclick=async()=>{button.disabled=true;status.textContent='Updating your preference…';try{const r=await fetch('/mtgtools/odyssey/api/subscriptions/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),signal:AbortSignal.timeout(15000)}),v=await r.json();if(!r.ok||!v.unsubscribed)throw Error(v.error||'Please try again.');status.textContent=v.message;button.hidden=true;}catch(e){status.textContent=e.message;button.disabled=false;}};})();
</script></body></html>
