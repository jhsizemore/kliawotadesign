<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Odyssey Landscape Art Library</title><style>body{margin:0;background:#141814;color:#eee8d8;font:16px system-ui}main{max-width:1440px;margin:auto;padding:28px}h1{font:38px Georgia;margin-bottom:8px}a{color:#dcc78d}header{margin-bottom:24px}input,select{font:inherit;padding:10px;margin:5px 8px 10px 0;max-width:100%;background:#252c25;color:inherit;border:1px solid #6a715c;border-radius:5px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}article{background:#222820;padding:12px;border-radius:6px}img{width:100%;height:200px;object-fit:contain;background:#ede8dc}h2{font-size:17px}small,p{line-height:1.5}.rights{color:#ddbc76}#status{margin:12px 0}nav{margin:18px 0}</style></head><body><main><header><h1>The Odyssey · Landscape Art Library</h1><p>Historical landscapes and environmental references. Actual depicted places are preserved; mythic uses are labelled as analogues.</p><nav><a href="./?library=landscapes">Open in Odyssey Studio</a> · <a href="https://docs.google.com/spreadsheets/d/1YyWqX2dwrtnSEtrbTKVxdQaDSaY_tlcxZgMp_-DyA6o/edit#gid=1525102038">Canonical Artwork Library</a></nav><input id="q" type="search" placeholder="Search place, artist, medium or tag" aria-label="Search landscapes"><select id="group" aria-label="Landscape collection"><option value="">All collections</option></select><p id="status" role="status"></p></header><div id="grid"></div></main><script src="./data/landscape-import.20260929.js?v=landscapes1"></script><script>
const data=window.ODYSSEY_LANDSCAPE_IMPORT,grid=document.getElementById('grid'),q=document.getElementById('q'),group=document.getElementById('group');for(const c of data.collections){const o=document.createElement('option');o.value=c.tag;o.textContent=c.label+' ('+c.count+')';group.append(o)}
function el(tag,content,cls){const e=document.createElement(tag);if(content)e.textContent=content;if(cls)e.className=cls;return e}function render(){const term=q.value.toLowerCase().trim(),list=data.artworks.filter(a=>(!group.value||a.collectionTag===group.value)&&(!term||[a.id,a.title,a.artist,a.tags,a.medium].join(' ').toLowerCase().includes(term)));grid.replaceChildren();document.getElementById('status').textContent=list.length+' records · '+data.summary.previewImages+' acquired previews in this batch · research, not final card approval';for(const a of list){const article=el('article');article.dataset.artId=a.id;if(a.imageUrl){const im=el('img');im.loading='lazy';im.src=a.imageUrl;im.alt=a.title;article.append(im)}else article.append(el('p','Source record only — image acquisition remains unresolved.'));article.append(el('small',a.id+' · '+a.landscapeCollection),el('h2',a.title),el('p',a.artist+(a.date?' · '+a.date:'')),el('p',a.rights,'rights'),el('small',a.cropNotes));const p=el('p'),link=el('a','Source and provenance');link.href=a.source;link.target='_blank';link.rel='noopener noreferrer';p.append(link);article.append(p);grid.append(article)}}q.addEventListener('input',render);group.addEventListener('change',render);render();
</script></body></html>
