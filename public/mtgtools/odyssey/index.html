<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Loading Odyssey Card Layout Studio…</title>
  <style>
    html,body{height:100%;margin:0;background:#10120f;color:#efe7d4;font-family:system-ui,sans-serif}
    body{display:grid;place-items:center}
    .loading{display:grid;gap:10px;text-align:center}
    .mark{font:700 28px Georgia,serif;color:#d4bb7d}
    .error{max-width:560px;padding:24px;line-height:1.5}
  </style>
</head>
<body>
  <div class="loading"><div class="mark">Odyssey</div><div>Loading card studio…</div></div>
  <script>
  (async () => {
    try {
      const response = await fetch('./app.html?v=20260918-2', { cache: 'no-store' });
      if (!response.ok) throw new Error('Studio source returned ' + response.status);
      let markup = await response.text();
      markup = markup.replace('</head>', '<link rel="stylesheet" href="./frame-system.css?v=20260918-2"></head>');
      const frameScript = '<script src="./frame-system.js?v=20260918-2"><' + '/script>';
      markup = markup.replace('</body>', frameScript + '</body>');
      document.open();
      document.write(markup);
      document.close();
    } catch (error) {
      document.body.innerHTML = '<div class="error"><h1>Odyssey could not load</h1><p id="loadError"></p><p>Reload the page to try again.</p></div>';
      document.getElementById('loadError').textContent = String(error.message || error);
    }
  })();
  </script>
</body>
</html>
