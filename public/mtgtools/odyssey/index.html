<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Loading Odyssey Card Layout Studio…</title>
  <style>
    html,body{height:100%;margin:0;background:#10120f;color:#efe7d4;font-family:system-ui,sans-serif}
    body{display:grid;place-items:center}
    .loading{display:grid;gap:10px;text-align:center}
    .mark{font:700 28px Georgia,serif;color:#d4bb7d}
    .error{max-width:560px;padding:24px;line-height:1.5}
  </style>
</head>
<body>
  <div class="loading"><div class="mark">Odyssey</div><div>Loading card studio…</div></div>
  <script>
  (async () => {
    try {
      // Fragments are not sent to the server. Clear the private editing key
      // before loading the editor or any external artwork.
      if (/^#odyssey-sync=[a-f0-9]{64}$/.test(location.hash)) {
        window.OdysseyIncomingSyncKey = location.hash.slice(14);
        history.replaceState(null, '', location.pathname + location.search);
      }
      const response = await fetch('./app.html?v=20260919-15', { cache: 'no-store' });
      if (!response.ok) throw new Error('Studio source returned ' + response.status);
      let markup = await response.text();
      const transferScript = '<script src="./art-settings-transfer.js?v=20260918-4"><' + '/script>';
      const mobileStyle = '<link rel="stylesheet" href="./mobile-navigation.css?v=20260918-5">';
      const polishStyle = '<link rel="stylesheet" href="./studio-polish.css?v=20260918-6">';
      markup = markup.replace('</head>', '<meta name="referrer" content="no-referrer"><link rel="stylesheet" href="./frame-system.css?v=20260918-2">' + transferScript + mobileStyle + polishStyle + '</head>');
      // Keep the canonical app/data intact. Scope only the four per-set state stores.
      const statePatches = [
        ["const STORAGE='odyssey-layout-overrides-v02';",
         "const ODYSSEY_ART_STATE=OdysseyArtTransfer.prepare(window.ODYSSEY_DATA,ODYSSEY_DATASET,localStorage);\nconst STORAGE=ODYSSEY_ART_STATE.keys.overrides;"],
        ["const CROP_PROFILE_STORAGE='odyssey-art-crop-profiles-v04', REVIEW_STORAGE='odyssey-card-review-v04', PROFILE_REVIEW_STORAGE='odyssey-profile-review-v05';",
         "const CROP_PROFILE_STORAGE=ODYSSEY_ART_STATE.keys.crops, REVIEW_STORAGE=ODYSSEY_ART_STATE.keys.review, PROFILE_REVIEW_STORAGE=ODYSSEY_ART_STATE.keys.profileReview;"]
      ];
      for (const [before, after] of statePatches) {
        if (!markup.includes(before)) throw new Error('Studio art-settings integration needs an update; saved settings have not been changed.');
        markup = markup.replace(before, after);
      }
      const frameScript = '<script src="./frame-system.js?v=20260918-2"><' + '/script>';
      const artworkScript = '<script src="./artwork-tools.js?v=20260918-4"><' + '/script>';
      const transferMount = '<script>OdysseyArtTransfer.mount(ODYSSEY_ART_STATE);<' + '/script>';
      const mobileScript = '<script src="./mobile-navigation.js?v=20260918-5"><' + '/script>';
      const polishScript = '<script src="./studio-polish.js?v=20260918-7"><' + '/script>';
      const syncCore = '<script src="./art-sync-core.js?v=20260918-6"><' + '/script>';
      const syncScript = '<script src="./art-sync.js?v=20260918-6"><' + '/script>';
      const mount = '<script>document.addEventListener("DOMContentLoaded",function(){try{OdysseyPolish.install();OdysseyArtSync.mount(ODYSSEY_ART_STATE);}catch(error){console.error("Odyssey continuity tools:",error);if(window.toast)toast("Device tools did not start; local editor is still available.");}},{once:true});<' + '/script>';
      markup = markup.replace('</body>', frameScript + artworkScript + transferMount + mobileScript + polishScript + syncCore + syncScript + mount + '</body>');
      document.open();
      document.write(markup);
      document.close();
    } catch (error) {
      document.body.innerHTML = '<div class="error"><h1>Odyssey could not load</h1><p id="loadError"></p><p>Reload the page to try again.</p></div>';
      document.getElementById('loadError').textContent = String(error.message || error);
    }
  })();
  </script>
</body>
</html>
