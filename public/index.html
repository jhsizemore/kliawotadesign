<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kliawota Disaen</title>
  <meta name="description" content="Kliawota Disaen is a design and communications studio in Vanuatu." />
  <meta name="theme-color" content="#f3f0e8" />
  <style>
    :root {
      --paper: #f3f0e8;
      --ink: #202728;
      --teal: #0d6f73;
      --muted: #687172;
      --line: rgba(32, 39, 40, 0.18);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 28px 34px 30px;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .location, .status, footer {
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .location, footer { color: var(--muted); }

    main {
      display: grid;
      align-content: center;
      padding: 11vh 0 12vh;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--teal);
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 1150px;
      margin: 0;
      font-size: clamp(64px, 11.2vw, 174px);
      line-height: 0.82;
      letter-spacing: -0.075em;
      font-weight: 900;
      text-transform: uppercase;
    }

    .rule {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 48px 0 22px;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(180px, 0.65fr) minmax(320px, 1.35fr);
      gap: 48px;
      max-width: 980px;
    }

    .status { color: var(--teal); }

    .intro p {
      margin: 0;
      max-width: 700px;
      font-size: clamp(18px, 2.1vw, 28px);
      line-height: 1.24;
      letter-spacing: -0.025em;
    }

    footer {
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 720px) {
      .page { padding: 20px 18px 22px; }
      header { align-items: flex-start; }
      .location { text-align: right; }
      main { padding: 12vh 0; }
      h1 { font-size: clamp(58px, 20vw, 96px); }
      .intro { grid-template-columns: 1fr; gap: 14px; }
      footer { flex-direction: column; align-items: flex-start; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">Kliawota Disaen</div>
      <div class="location">Port Vila · Vanuatu</div>
    </header>

    <main>
      <p class="eyebrow">Design · Communication · Creative support</p>
      <h1>Kliawota<br />Disaen</h1>
      <div class="rule"></div>
      <div class="intro">
        <div class="status">New site in development</div>
        <p>Practical, high-quality design and communications support for businesses and organisations in Vanuatu and across the Pacific.</p>
      </div>
    </main>

    <footer>
      <span>kliawota.design</span>
      <span>© 2026 Kliawota Disaen</span>
    </footer>
  </div>
</body>
</html>
