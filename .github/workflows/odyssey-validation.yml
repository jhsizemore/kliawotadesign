name: Odyssey validation
on:
  push:
    branches: [main, 'odyssey/**']
    paths: ['public/mtgtools/odyssey/**', 'src/**', 'tests/**', 'wrangler.jsonc', '.github/workflows/odyssey-validation.yml']
  pull_request:
    paths: ['public/mtgtools/odyssey/**', 'src/**', 'tests/**', 'wrangler.jsonc']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests
        run: node --test tests/odyssey-*.test.*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-validation-snapshot
          retention-days: 3
          path: |
            public/mtgtools/odyssey/
            src/
            tests/
            package.json
            wrangler.jsonc
