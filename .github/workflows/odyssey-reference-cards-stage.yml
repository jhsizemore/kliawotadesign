name: Odyssey Scryfall reference cards staging
on:
  push:
    branches: [odyssey/reference-cards-20260919]
    paths:
      - '.github/workflows/odyssey-reference-cards-stage.yml'
      - 'scripts/odyssey-build-reference-cards.py'
      - 'scripts/odyssey-reference-*'
      - 'tests/odyssey-reference-cards.test.cjs'
      - 'public/mtgtools/odyssey/card-reference-browser.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odyssey-reference-cards-stage
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.ref == 'refs/heads/odyssey/reference-cards-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build all original-card references from one Scryfall Oracle bulk snapshot
        run: |
          mkdir -p /tmp/odyssey-card-references/browser
          python scripts/odyssey-build-reference-cards.py | tee /tmp/odyssey-card-references/generator.log
      - name: Integrate reference layer into Studio
        run: python scripts/odyssey-reference-integration.py | tee /tmp/odyssey-card-references/integration.log
      - name: Run all regression and reference-coverage tests
        run: node --test tests/*.test.cjs tests/*.test.js | tee /tmp/odyssey-card-references/tests.txt
      - name: Install browser verifier
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify review UI, Scryfall images and persistent review state on desktop/mobile
        run: |
          python -m http.server 8787 --directory public > /tmp/odyssey-card-references/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python scripts/odyssey-reference-browser.py | tee /tmp/odyssey-card-references/browser.log
      - name: Verify complete Worker build without deployment
        run: |
          npm install --no-package-lock
          npx wrangler deploy --dry-run --outdir /tmp/odyssey-reference-worker | tee /tmp/odyssey-card-references/worker.log
      - name: Commit verified generated reference data and integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mtgtools/odyssey/data/card-references.json public/mtgtools/odyssey/data/card-references.js public/mtgtools/odyssey/app.html public/mtgtools/odyssey/index.html public/mtgtools/odyssey/studio-polish.js public/mtgtools/odyssey/data/release.json tests/odyssey-release.test.cjs
          git diff --cached --stat > /tmp/odyssey-card-references/changes.txt
          git diff --cached --quiet || git commit -m 'Add Scryfall template and mechanics references for every original Odyssey card'
          git push origin HEAD:refs/heads/odyssey/reference-cards-20260919
          git rev-parse HEAD > /tmp/odyssey-card-references/verified-commit.txt
      - name: Package audit
        if: always()
        run: |
          cp /tmp/odyssey-card-references/summary.json /tmp/odyssey-card-references/summary-copy.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-reference-cards-verification
          path: /tmp/odyssey-card-references
          retention-days: 7
