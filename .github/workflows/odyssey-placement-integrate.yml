name: Integrate Odyssey artwork placement
on:
  push:
    branches: [odyssey-placement-sync]
    paths:
      - '.github/workflows/odyssey-placement-integrate.yml'
      - 'scripts/install-odyssey-placement.py'
      - 'public/mtgtools/odyssey/art-placement-*.js'
      - 'public/mtgtools/Odyssey/scry/placement-sync.js'
      - 'src/odyssey-placement.mjs'
      - 'tests/odyssey-placement*'
permissions:
  contents: write
concurrency:
  group: placement-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/odyssey-placement-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: odyssey-placement-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate with exact source anchors and regenerate native renderer
        run: |
          python scripts/install-odyssey-placement.py
          node scripts/build-odyssey-public-renderer.cjs
          git config user.name 'Odyssey placement integration'
          git config user.email 'actions@users.noreply.github.com'
          git add src/odyssey-worker.js src/odyssey-sync.mjs public/mtgtools/odyssey/app.html public/mtgtools/odyssey/index.html public/mtgtools/Odyssey/scry/index.html public/mtgtools/Odyssey/scry/social/index.html scripts/build-odyssey-public-renderer.cjs public/mtgtools/odyssey/public-renderer.generated.js tests/odyssey-exhibition-browser.py
          if ! git diff --cached --quiet; then
            git commit -m 'Wire Studio and Scry to shared published artwork placements'
            git push origin HEAD:odyssey-placement-sync
          fi
      - name: Protocol and native-renderer regression tests
        run: |
          mkdir -p test-results/odyssey-placement
          node --test tests/odyssey-placement.test.cjs tests/odyssey-art-settings-transfer.test.cjs tests/odyssey-frame-fidelity.test.cjs tests/odyssey-transform-faces.test.cjs tests/odyssey-exhibition.cjs | tee test-results/odyssey-placement/unit-tests.txt
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real Studio and Scry browser checks
        run: |
          python -m http.server 8765 --directory public >/tmp/placement-http.log 2>&1 &
          python tests/odyssey-placement-browser.py
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-placement-integration
          path: test-results/odyssey-placement/
          if-no-files-found: ignore
