name: Odyssey artwork journey review
on:
  push:
    branches: [odyssey-art-journey]
    paths:
      - '.github/workflows/odyssey-art-journey.yml'
      - 'scripts/build-odyssey-art-journey.py'
      - 'public/mtgtools/Odyssey/scry/art-direction.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odyssey-art-journey-assets
  cancel-in-progress: true
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build genuine source-image derivatives
        run: |
          python -m pip install -q Pillow==11.3.0
          python scripts/build-odyssey-art-journey.py
      - name: Package the exact review assets
        run: |
          mkdir -p test-results
          python - <<'PY'
          import zipfile
          from pathlib import Path
          root=Path('public/mtgtools/Odyssey/scry')
          with zipfile.ZipFile('test-results/art-journey-assets.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in (root/'assets/journey').glob('*.webp'): z.write(p)
              for name in ['art-direction.json','art-journey-assets.json','art-journey-assets.js']:z.write(root/name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: odyssey-art-journey-review-assets
          path: test-results/art-journey-assets.zip
          retention-days: 7
      - name: Commit verified derived assets to the feature branch only
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/odyssey-art-journey | cut -f1)" = "$EXPECTED_SHA"
          git add -- public/mtgtools/Odyssey/scry/assets/journey public/mtgtools/Odyssey/scry/art-journey-assets.json public/mtgtools/Odyssey/scry/art-journey-assets.js
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish reviewed-resolution derivatives for the Odyssey artwork journey'
          git push origin HEAD:odyssey-art-journey
