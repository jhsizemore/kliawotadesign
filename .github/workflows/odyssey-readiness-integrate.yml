name: Odyssey readiness final integration
on:
  push:
    branches: [odyssey-launch-readiness]
    paths: ['.github/workflows/odyssey-readiness-integrate.yml']
permissions:
  contents: write
concurrency:
  group: odyssey-readiness-integrate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 48
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve newer main work and regenerate only derived artifacts
        run: |
          git config user.name 'Odyssey readiness verification'
          git config user.email 'actions@users.noreply.github.com'
          git fetch --depth=48 origin main
          git merge --no-commit --no-ff origin/main
          node scripts/build-odyssey-public-renderer.cjs
          node scripts/build-odyssey-public-renderer.cjs --check
          node - <<'JS'
          const fs=require('fs'),cp=require('child_process'),assert=require('assert/strict');
          for(const file of ['odyssey-data.json','odyssey-analysis-candidate-v2.json','odyssey-public-candidate.json']){
           const p='public/mtgtools/odyssey/data/'+file,a=JSON.parse(cp.execFileSync('git',['show','origin/main:'+p],{maxBuffer:16000000})),b=JSON.parse(fs.readFileSync(p));
           for(const key of ['cards','artworks','coverage'])assert.deepEqual(a[key],b[key],file+': '+key);
          }
          console.log('Preserved all current-main card, artwork and coverage entries.');
          JS
      - name: Run complete regression suite
        run: |
          mkdir -p test-results/odyssey-readiness
          node --test --test-reporter=tap tests/*.test.cjs tests/*.test.js tests/*.test.mjs >test-results/odyssey-readiness/all-tests.tap 2>&1 || { grep -A35 '^not ok' test-results/odyssey-readiness/all-tests.tap; exit 1; }
          tail -12 test-results/odyssey-readiness/all-tests.tap
      - name: Verify final Worker build
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/readiness-final-build
      - name: Save final regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-readiness-final-source-check
          path: test-results/odyssey-readiness/
      - name: Commit verified reconciliation to feature branch only
        run: |
          test "$(git ls-remote origin refs/heads/odyssey-launch-readiness | cut -f1)" = "${{ github.sha }}"
          git add public/mtgtools/odyssey/public-renderer.generated.js public/mtgtools/odyssey/data/odyssey-public-candidate.json
          if test -f .git/MERGE_HEAD || ! git diff --cached --quiet; then
            git commit -m 'Preserve concurrent landscape additions and verify readiness renderer'
            git push origin HEAD:odyssey-launch-readiness
          fi
