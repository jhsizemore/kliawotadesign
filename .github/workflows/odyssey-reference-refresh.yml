name: Odyssey reference cards refresh
on:
  push:
    branches: [main]
    paths:
      - 'scripts/odyssey-build-reference-cards.py'
      - 'scripts/odyssey-reference-policy.json'
      - 'public/mtgtools/odyssey/data/card-references.json'
      - 'public/mtgtools/odyssey/data/odyssey-data.json'
      - 'tests/test_odyssey_reference_selection.py'
      - 'scripts/odyssey-reference-integration.py'
      - 'scripts/odyssey-reference-browser.py'
      - 'public/mtgtools/odyssey/card-reference-browser.js'
      - 'tests/odyssey-reference-cards.test.cjs'
      - '.github/workflows/odyssey-reference-refresh.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/odyssey-build-reference-cards.py'
      - 'scripts/odyssey-reference-policy.json'
      - 'public/mtgtools/odyssey/data/card-references.json'
      - 'public/mtgtools/odyssey/data/odyssey-data.json'
      - 'tests/test_odyssey_reference_selection.py'
      - 'scripts/odyssey-reference-integration.py'
      - 'scripts/odyssey-reference-browser.py'
      - 'public/mtgtools/odyssey/card-reference-browser.js'
      - 'tests/odyssey-reference-cards.test.cjs'
      - '.github/workflows/odyssey-reference-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odyssey-reference-refresh-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  rebuild:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check reference tooling
        run: |
          python -m py_compile scripts/odyssey-build-reference-cards.py scripts/odyssey-reference-integration.py scripts/odyssey-reference-browser.py
      - name: Verify selection exclusions and mechanic boundaries
        run: python -m unittest discover -s tests -p 'test_odyssey_reference_selection.py'
      - name: Rebuild references from current Scryfall Oracle bulk
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/odyssey-card-references/browser
          python scripts/odyssey-build-reference-cards.py | tee /tmp/odyssey-card-references/generator.log
      - name: Integrate rebuilt reference layer
        if: github.event_name != 'pull_request'
        run: python scripts/odyssey-reference-integration.py | tee /tmp/odyssey-card-references/integration.log
      - name: Verify full-set reference policy
        run: |
          mkdir -p /tmp/odyssey-card-references
          node --test tests/odyssey-reference-cards.test.cjs | tee /tmp/odyssey-card-references/tests.txt
      - name: Commit verified generated reference data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            public/mtgtools/odyssey/data/card-references.json \
            public/mtgtools/odyssey/data/card-references.js \
            public/mtgtools/odyssey/data/reference-refresh-audit.json \
            public/mtgtools/odyssey/data/release.json \
            public/mtgtools/odyssey/app.html \
            public/mtgtools/odyssey/index.html
          if git diff --cached --quiet; then
            echo 'Reference outputs already current.'
          else
            git commit -m 'Refresh Odyssey full-set card references'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
            else
              git push origin HEAD:refs/heads/main
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-reference-refresh
          path: /tmp/odyssey-card-references
          retention-days: 7
