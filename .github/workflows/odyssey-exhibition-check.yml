name: Odyssey exhibition verification
on:
  push:
    branches: [main]
    paths:
      - 'public/mtgtools/Odyssey/scry/**'
      - 'public/mtgtools/odyssey/**'
      - 'scripts/build-odyssey-public-renderer.cjs'
      - 'tests/odyssey-exhibition*'
      - 'tests/odyssey-focused-launch.py'
      - 'package.json'
      - '.github/workflows/odyssey-exhibition-check.yml'
  pull_request:
    paths:
      - 'public/mtgtools/Odyssey/scry/**'
      - 'public/mtgtools/odyssey/**'
      - 'scripts/build-odyssey-public-renderer.cjs'
      - 'tests/odyssey-exhibition*'
      - 'tests/odyssey-focused-launch.py'
      - 'package.json'
      - '.github/workflows/odyssey-exhibition-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odyssey-exhibition-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exhibition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies without changing the committed renderer
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify source parity and published data
        run: |
          node scripts/build-odyssey-public-renderer.cjs --check
          node tests/odyssey-exhibition.cjs
      - name: Install browser test dependency
        run: |
          python -m pip install -q playwright==1.57.0
          python -m playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -60 /tmp/browser-install.log; exit 1; }
      - name: Run focused-launch and full-exhibition browser checks
        run: |
          python -m http.server 8765 --directory public > /tmp/odyssey-exhibition-http.log 2>&1 &
          python -u tests/odyssey-focused-launch.py
          python -u tests/odyssey-exhibition-browser.py
      - name: Save visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-exhibition-visual-checks
          path: |
            test-results/odyssey-focused-launch/
            test-results/odyssey-exhibition/
          if-no-files-found: ignore
