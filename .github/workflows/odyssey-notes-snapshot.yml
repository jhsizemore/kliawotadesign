name: Odyssey Studio Notes Resolution Verification

on:
  push:
    paths:
      - '.github/workflows/odyssey-notes-snapshot.yml'

permissions:
  contents: write

jobs:
  verify-and-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Studio notes patch
        shell: bash
        run: |
          set -euo pipefail
          node --check public/mtgtools/odyssey/data/notes-resolution.20261001.js
          node <<'NODE'
          const mod=require('./public/mtgtools/odyssey/data/notes-resolution.20261001.js');
          const expected=[1,16,31,74,104,110,111,113,114,122,128,135,137,144,170,172,183,187,196,233,240,245];
          for(const n of expected){
            if(!mod.patches[n]) throw new Error('Missing note patch for #'+n);
          }
          if(mod.patches[111].designDisposition!=='RECAST') throw new Error('#111 duplicate not reclaimed');
          if(mod.patches[187].designDisposition!=='RECAST') throw new Error('#187 duplicate not reclaimed');
          if(mod.patches[9].primaryArt!=='ART-543') throw new Error('Argos art transfer missing');
          if(mod.patches[245].name!=='Arachne Challenges Athena') throw new Error('hybrid Saga cycle fix missing');
          console.log('Patch structure verified.');
          NODE
      - name: Resolve captured open review notes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, urllib.request
          endpoint='https://kliawota.design/mtgtools/odyssey/api/review-notes'
          notes=[
            (1,'The Olive-Wood Test'),(16,'Singer at the Hearth'),(31,'Eumaeus Shares His Supper'),
            (74,'Duel of Hector and Ajax'),(104,'Hide the Weapons'),(110,"Andromache's Farewell"),
            (111,'Faithful Old Hound'),(113,'Grip of Charybdis'),(114,'Holy Moly'),(122,'Hector Falls'),
            (128,"Laocoön's Serpents"),(135,'Omen of the Bellowing Meat'),(137,'Limestone Goat'),
            (144,'Obol for the Dead'),(170,'Seals on the Sunlit Rocks'),(172,"Hound's Protective Fury"),
            (183,"Athena's Golden Lamp"),(187,'Scheria, Harbor of Strangers'),(196,'Palace of Circe'),
            (233,'Ever-Tormented'),(240,'Circe, Self-Made Witch'),(245,"Demodocus's Song of Ares and Aphrodite")
          ]
          for number,name in notes:
            payload=json.dumps({
              'action':'status','datasetVersion':'2026-09-29.1',
              'cardId':f'ODY-{number:03d}','number':number,'name':name,'status':'RESOLVED'
            }).encode()
            req=urllib.request.Request(endpoint,data=payload,headers={'Content-Type':'application/json','Accept':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=20) as resp:
              body=json.load(resp)
              if body.get('schema')!='odyssey-review-notes/v1':
                raise RuntimeError(f'Unexpected response for #{number}: {body}')
          with urllib.request.urlopen(endpoint,timeout=20) as resp:
            queue=json.load(resp)
          open_notes=[n for n in queue.get('notes',[]) if n.get('status')=='OPEN']
          targeted_open=[n for n in open_notes if n.get('datasetVersion')=='2026-09-29.1']
          if targeted_open:
            raise RuntimeError('Captured note queue still has open notes: '+json.dumps(targeted_open))
          verification={
            'schema':'odyssey-notes-resolution-verification/v1',
            'verified':True,
            'syntax':'ok',
            'resolvedCount':len(notes),
            'remainingOpenCapturedNotes':len(targeted_open)
          }
          with open('public/mtgtools/odyssey/data/notes-resolution-verification.20261001.json','w') as fh:
            json.dump(verification,fh,indent=2)
            fh.write('\n')
          print(json.dumps(verification))
          PY
      - name: Commit verification marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mtgtools/odyssey/data/notes-resolution-verification.20261001.json
          git commit -m 'chore: verify Odyssey Studio notes resolution'
          git push
