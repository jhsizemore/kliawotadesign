name: Odyssey Studio Notes Resolution Verification

on:
  push:
    paths:
      - '.github/workflows/odyssey-notes-snapshot.yml'

permissions:
  contents: write

jobs:
  verify-and-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Studio notes patch
        shell: bash
        run: |
          set -euo pipefail
          node --check public/mtgtools/odyssey/data/notes-resolution.20261001.js
          node <<'NODE'
          const mod=require('./public/mtgtools/odyssey/data/notes-resolution.20261001.js');
          const expected=[1,16,31,74,104,110,111,113,114,122,128,135,137,144,170,172,183,187,196,233,240,245];
          for(const n of expected) if(!mod.patches[n]) throw new Error('Missing note patch for #'+n);
          if(mod.patches[111].designDisposition!=='RECAST') throw new Error('#111 duplicate not reclaimed');
          if(mod.patches[187].designDisposition!=='RECAST') throw new Error('#187 duplicate not reclaimed');
          if(mod.patches[9].primaryArt!=='ART-543') throw new Error('Argos art transfer missing');
          if(mod.patches[245].name!=='Arachne Challenges Athena') throw new Error('hybrid Saga cycle fix missing');
          console.log('Patch structure verified.');
          NODE
      - name: Resolve captured open review notes
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://kliawota.design/mtgtools/odyssey/api/review-notes'
          cat > /tmp/notes.json <<'JSON'
          [
            {"number":1,"name":"The Olive-Wood Test"},
            {"number":16,"name":"Singer at the Hearth"},
            {"number":31,"name":"Eumaeus Shares His Supper"},
            {"number":74,"name":"Duel of Hector and Ajax"},
            {"number":104,"name":"Hide the Weapons"},
            {"number":110,"name":"Andromache's Farewell"},
            {"number":111,"name":"Faithful Old Hound"},
            {"number":113,"name":"Grip of Charybdis"},
            {"number":114,"name":"Holy Moly"},
            {"number":122,"name":"Hector Falls"},
            {"number":128,"name":"Laocoön's Serpents"},
            {"number":135,"name":"Omen of the Bellowing Meat"},
            {"number":137,"name":"Limestone Goat"},
            {"number":144,"name":"Obol for the Dead"},
            {"number":170,"name":"Seals on the Sunlit Rocks"},
            {"number":172,"name":"Hound's Protective Fury"},
            {"number":183,"name":"Athena's Golden Lamp"},
            {"number":187,"name":"Scheria, Harbor of Strangers"},
            {"number":196,"name":"Palace of Circe"},
            {"number":233,"name":"Ever-Tormented"},
            {"number":240,"name":"Circe, Self-Made Witch"},
            {"number":245,"name":"Demodocus's Song of Ares and Aphrodite"}
          ]
          JSON
          while IFS= read -r note; do
            number="$(jq -r '.number' <<<"$note")"
            name="$(jq -r '.name' <<<"$note")"
            card_id="$(printf 'ODY-%03d' "$number")"
            payload="$(jq -nc --arg dv '2026-09-29.1' --arg id "$card_id" --arg name "$name" --argjson n "$number" '{action:"status",datasetVersion:$dv,cardId:$id,number:$n,name:$name,status:"RESOLVED"}')"
            response="$(curl --fail-with-body --silent --show-error --retry 2 \
              -X POST "$endpoint" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://kliawota.design' \
              -H 'Referer: https://kliawota.design/mtgtools/odyssey/' \
              -H 'Sec-Fetch-Site: same-origin' \
              -H 'User-Agent: Mozilla/5.0 OdysseyStudioNotes/20261001' \
              --data-binary "$payload")"
            test "$(jq -r '.schema' <<<"$response")" = 'odyssey-review-notes/v1'
          done < <(jq -c '.[]' /tmp/notes.json)

          curl --fail --silent --show-error --retry 2 \
            -H 'Accept: application/json' \
            -H 'User-Agent: Mozilla/5.0 OdysseyStudioNotes/20261001' \
            "$endpoint" > /tmp/queue.json
          remaining="$(jq '[.notes[] | select(.datasetVersion=="2026-09-29.1" and .status=="OPEN")] | length' /tmp/queue.json)"
          test "$remaining" = '0'
          cat > public/mtgtools/odyssey/data/notes-resolution-verification.20261001.json <<JSON
          {
            "schema": "odyssey-notes-resolution-verification/v1",
            "verified": true,
            "syntax": "ok",
            "resolvedCount": 22,
            "remainingOpenCapturedNotes": 0
          }
          JSON
      - name: Commit verification marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mtgtools/odyssey/data/notes-resolution-verification.20261001.json
          git commit -m 'chore: verify Odyssey Studio notes resolution'
          git push
