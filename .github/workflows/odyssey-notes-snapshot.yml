name: Odyssey Studio State Snapshot

on:
  push:
    paths:
      - '.github/workflows/odyssey-notes-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch shared Studio state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/mtgtools/odyssey/data
          curl --fail --silent --show-error --retry 3 \
            'https://kliawota.design/mtgtools/odyssey/api/review-notes' \
            -o public/mtgtools/odyssey/data/live-notes-snapshot.json
          curl --fail --silent --show-error --retry 3 \
            'https://kliawota.design/mtgtools/odyssey/api/finishing' \
            -o public/mtgtools/odyssey/data/live-finishing-snapshot.json
          python -m json.tool public/mtgtools/odyssey/data/live-notes-snapshot.json >/dev/null
          python -m json.tool public/mtgtools/odyssey/data/live-finishing-snapshot.json >/dev/null
      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mtgtools/odyssey/data/live-notes-snapshot.json public/mtgtools/odyssey/data/live-finishing-snapshot.json
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged.'
          else
            git commit -m 'chore: capture live Odyssey Studio state'
            git push
          fi
