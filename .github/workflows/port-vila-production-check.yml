name: Port Vila production verification

on:
  push:
    branches: [main]
    paths:
      - 'public/portvilasandbox/**'
      - '.github/workflows/port-vila-production-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-vila-production-verification
  cancel-in-progress: true

jobs:
  verify-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed Port Vila onboarding bytes
        shell: bash
        run: |
          set -euo pipefail
          base='https://kliawota.design/portvilasandbox/'
          local_sha="$(sha256sum public/portvilasandbox/index.html | awk '{print $1}')"
          echo "Local index SHA: $local_sha"

          for attempt in $(seq 1 36); do
            url="${base}?verify=${GITHUB_SHA}-${attempt}"
            body="$(mktemp)"
            headers="$(mktemp)"
            preview="$(mktemp)"

            if curl --fail --silent --show-error --location               -H 'Cache-Control: no-cache'               -D "$headers"               -o "$body" "$url"; then
              live_sha="$(sha256sum "$body" | awk '{print $1}')"
              echo "Attempt $attempt live SHA: $live_sha"
              grep -iE '^(cf-cache-status|cache-control|etag|age|last-modified):' "$headers" || true

              preview_ok=false
              if curl --fail --silent --show-error --location                 -H 'Cache-Control: no-cache'                 -o "$preview" "${base}assets/loader-preview.png?verify=${GITHUB_SHA}-${attempt}"; then
                preview_bytes="$(wc -c < "$preview" | tr -d ' ')"
                preview_sig="$(od -An -tx1 -N8 "$preview" | tr -d ' \n')"
                if [ "$preview_bytes" -gt 100000 ] && [ "$preview_sig" = "89504e470d0a1a0a" ]; then
                  preview_ok=true
                  echo "Live loader preview: ${preview_bytes} bytes."
                fi
              fi

              if grep -q 'Explore Port Vila' "$body"                 && grep -q 'Downtown in 3D.' "$body"                 && grep -q 'Welcome to the Port Vila Sandbox' "$body"                 && grep -q 'Leave Port Vila Sandbox?' "$body"                 && grep -q 'mobile-onboarding-2' "$body"                 && [ "$preview_ok" = true ]; then
                echo "Live onboarding, navigation and app-preview markers are present."
                if [ "$live_sha" = "$local_sha" ]; then
                  echo "Live index exactly matches repository index."
                else
                  echo "Markers are live, although transformed/cached bytes differ from local."
                fi
                exit 0
              fi
            fi
            sleep 10
          done

          echo 'Live Port Vila build never exposed the current onboarding/navigation/preview assets.'
          exit 1
