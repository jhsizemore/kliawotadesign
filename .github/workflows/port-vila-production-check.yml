name: Port Vila production verification

on:
  push:
    branches: [main]
    paths:
      - 'public/portvilasandbox/**'
      - '.github/workflows/port-vila-production-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/portvilasandbox/**'
      - 'scripts/port-vila-stability-build.py'
      - 'tests/port-vila-stability.test.mjs'
      - '.github/workflows/port-vila-production-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-vila-production-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and verify the canonical module graph
        run: |
          python3 scripts/port-vila-stability-build.py
          git diff --exit-code -- public/portvilasandbox/assets
          node --check public/portvilasandbox/assets/index-stability-1.js
          node --test tests/port-vila-stability.test.mjs
  verify-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed Port Vila onboarding bytes
        shell: bash
        run: |
          set -euo pipefail
          base='https://kliawota.design/portvilasandbox/'
          local_sha="$(sha256sum public/portvilasandbox/index.html | awk '{print $1}')"
          local_header_sha="$(sha256sum public/portvilasandbox/assets/loader-header.jpg | awk '{print $1}')"
          echo "Local index SHA: $local_sha"
          echo "Local header SHA: $local_header_sha"

          for attempt in $(seq 1 36); do
            url="${base}?verify=${GITHUB_SHA}-${attempt}"
            body="$(mktemp)"
            headers="$(mktemp)"
            header="$(mktemp)"

            if curl --fail --silent --show-error --location               -H 'Cache-Control: no-cache'               -D "$headers"               -o "$body" "$url"; then
              live_sha="$(sha256sum "$body" | awk '{print $1}')"
              echo "Attempt $attempt live SHA: $live_sha"
              grep -iE '^(cf-cache-status|cache-control|etag|age|last-modified):' "$headers" || true

              header_ok=false
              if curl --fail --silent --show-error --location                 -H 'Cache-Control: no-cache'                 -o "$header" "${base}assets/loader-header.jpg?verify=${GITHUB_SHA}-${attempt}"; then
                header_bytes="$(wc -c < "$header" | tr -d ' ')"
                header_sig="$(od -An -tx1 -N3 "$header" | tr -d ' \n')"
                live_header_sha="$(sha256sum "$header" | awk '{print $1}')"
                if [ "$header_sig" = "ffd8ff" ] && [ "$live_header_sha" = "$local_header_sha" ]; then
                  header_ok=true
                  echo "Live supplied loader header matches repository: ${header_bytes} bytes."
                else
                  echo "Header mismatch: signature=$header_sig live=$live_header_sha"
                fi
              fi

              if grep -q 'Explore Port Vila' "$body"                 && grep -q 'Downtown in 3D.' "$body"                 && grep -q 'Welcome to the Port Vila Sandbox' "$body"                 && grep -q 'Leave Port Vila Sandbox?' "$body"                 && grep -q 'index-stability-1.js' "$body"                 && grep -q 'loader-header.jpg' "$body"                 && [ "$header_ok" = true ]; then
                echo "Live onboarding, navigation and supplied loader header are present."
                if [ "$live_sha" = "$local_sha" ]; then
                  echo "Live index exactly matches repository index."
                else
                  echo "Markers are live, although transformed/cached bytes differ from local."
                fi
                assets_ok=true
                for asset in index-stability-1.js research-stability-1.js vision-stability-1.js stability-runtime-1.js; do
                  expected="$(sha256sum "public/portvilasandbox/assets/$asset" | awk '{print $1}')"
                  if curl --max-time 20 --fail --silent --show-error --location -o "$header" "${base}assets/${asset}?verify=${GITHUB_SHA}-${attempt}"; then
                    actual="$(sha256sum "$header" | awk '{print $1}')"
                    [ "$expected" = "$actual" ] || assets_ok=false
                  else
                    assets_ok=false
                  fi
                done
                if [ "$assets_ok" = true ]; then
                  echo 'All stability modules exactly match repository bytes.'
                  exit 0
                fi
              fi
            fi
            sleep 10
          done

          echo 'Live Port Vila build never exposed the current onboarding/navigation/header assets.'
          exit 1
