name: Odyssey Studio exhibition integration
on:
  push:
    branches: [odyssey-exhibition-studio-polish]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odyssey-studio-exhibition-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot renderer source
        run: |
          mkdir -p test-results
          python - <<'PY'
          from pathlib import Path
          import zipfile
          roots=['public/mtgtools/odyssey','public/mtgtools/Odyssey/scry','tests','.github/workflows','src']
          files=[Path(p) for p in ['package.json','wrangler.jsonc','wrangler.toml','worker.js'] if Path(p).exists()]
          for root in roots:
              for p in Path(root).rglob('*'):
                  if not p.is_file(): continue
                  text=p.suffix in ['.html','.js','.cjs','.mjs','.css','.json','.md','.yml','.py','.ts','.toml'] and p.stat().st_size<10000000
                  image=('assets/artwork/' in str(p) and p.suffix=='.webp') or 'assets/mana-pips/' in str(p)
                  if text or image: files.append(p)
          with zipfile.ZipFile('test-results/studio-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p)
          print(len(files),'files;',Path('test-results/studio-source.zip').stat().st_size,'bytes')
          PY
      - name: Save integration source
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-studio-source-lean
          path: test-results/studio-source.zip
          retention-days: 3
