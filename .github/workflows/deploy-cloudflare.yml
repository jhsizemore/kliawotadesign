name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Island Together syntax check
        run: node -e "const fs=require('fs'); for (const f of ['public/climate-game/scenarios.js','public/climate-game/game.js','public/climate-game/logistics.js','public/climate-game/world.js']) new Function(fs.readFileSync(f,'utf8'));"

      - name: Island Together logistics tests
        run: node --test tests/island-together-logistics.test.cjs

      - name: Test Island Together runtime
        run: npm run test:island

      - name: Deploy Worker and assets
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
