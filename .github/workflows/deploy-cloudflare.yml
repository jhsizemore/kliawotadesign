name: CI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Odyssey public renderer
        run: npm run build:renderer

      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Island Together syntax check
        run: node -e "const fs=require('fs'); for (const f of ['public/climate-game/scenarios.js','public/climate-game/game.js','public/climate-game/logistics.js','public/climate-game/world.js']) new Function(fs.readFileSync(f,'utf8'));"

      - name: Island Together logistics tests
        run: node --test tests/island-together-logistics.test.cjs

      - name: Test Island Together runtime
        run: npm run test:island
