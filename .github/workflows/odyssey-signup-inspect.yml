name: Odyssey candidate and signup source inspection
on:
  push:
    branches: [odyssey-candidates-crops-signup]
    paths: ['.github/workflows/odyssey-signup-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public delivery and collect source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,zipfile,urllib.request
          out=Path('test-results/odyssey-signup-source');out.mkdir(parents=True,exist_ok=True)
          for key,path in [('live-placement','/mtgtools/odyssey/api/art-placement'),('live-contact','/mtgtools/odyssey/api/contact'),('live-release','/mtgtools/odyssey/data/release.json'),('live-page','/mtgtools/Odyssey/scry/')]:
              try:
                  req=urllib.request.Request('https://kliawota.design'+path,headers={'User-Agent':'Odyssey-public-regression'})
                  with urllib.request.urlopen(req,timeout=25) as response: body=response.read().decode()
                  (out/(key+('.html' if key=='live-page' else '.json'))).write_text(body)
              except Exception as e:(out/(key+'-error.txt')).write_text(str(e))
          roots=['public/mtgtools/Odyssey/scry','public/mtgtools/odyssey','scripts','tests','src','.github/workflows']
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for r in roots:
                  for p in Path(r).rglob('*'):
                      if not p.is_file():continue
                      text=p.suffix in {'.js','.json','.cjs','.mjs','.html','.css','.py','.md','.yml','.ts'} and p.stat().st_size<12000000
                      small=p.name.endswith('.thumb.webp') or '/assets/mana-pips/' in str(p) or '/assets/brand/' in str(p) or p.suffix in ['.woff','.woff2']
                      if text or small:z.write(p)
              for p in map(Path,['package.json','wrangler.jsonc','wrangler.toml']):
                  if p.exists():z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: odyssey-signup-source
          path: test-results/odyssey-signup-source/
          retention-days: 3
