name: Odyssey production verification
on:
  push:
    branches: [main]
    paths:
      - 'public/mtgtools/odyssey/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'scripts/odyssey-production-artwork.py'
      - 'scripts/odyssey-refinement-browser.py'
      - 'scripts/odyssey-sheet-editor-browser.py'
      - 'scripts/odyssey-reference-browser.py'
      - 'scripts/odyssey-initial-templating.py'
      - 'scripts/odyssey-obscure-prune.py'
      - '.github/workflows/odyssey-production-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odyssey-production-verification
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed source bytes and isolated sync endpoint
        run: |
          mkdir -p /tmp/odyssey-production-check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash,randomBytes} from 'node:crypto';
          const base='https://kliawota.design/mtgtools/odyssey/';
          const files=['index.html','app.html','frame-system.js','frame-system.css','art-settings-transfer.js','art-sync-core.js','art-sync.js','card-sheet-editor.js','card-reference-browser.js','review-notes.js','media-preview.js','design-refinement.js','studio-polish.js','studio-polish.css','data/card-references.json','data/card-references.js','data/templating-report.json','data/empty-slot-report.json','data/odyssey-data.json','data/odyssey-data.js','data/odyssey-analysis-candidate-v1.json','data/odyssey-analysis-candidate-v2.json','data/release.json'];
          const hash=text=>createHash('sha256').update(text).digest('hex');
          let results=[],matched=false;
          for(let attempt=1;attempt<=60;attempt++){
            results=await Promise.all(files.map(async file=>{
              try{
                const response=await fetch(base+file+'?verify='+process.env.GITHUB_SHA+'-'+attempt,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
                const text=await response.text();
                const result={file,status:response.status,sameAsRepository:response.ok&&hash(text)===hash(fs.readFileSync('public/mtgtools/odyssey/'+file,'utf8'))};
                if(file==='data/release.json'&&response.ok){const release=JSON.parse(text);result.version=release.version;result.cards=release.cards;result.artworks=release.artworks;result.appRevision=release.appRevision;result.referenceCards=release.referenceCards;result.templating=release.templating;result.emptySlots=release.emptySlots;result.calchasRecast=release.calchasRecast;}
                return result;
              }catch(error){return {file,error:String(error)}}
            }));
            matched=results.every(result=>result.sameAsRepository);
            console.log(JSON.stringify({attempt,matched}));
            if(matched)break;
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          let sync,notes;
          try{
            const anonymous=await fetch(base+'api/art-sync',{signal:AbortSignal.timeout(15000)});
            const isolated=await fetch(base+'api/art-sync',{headers:{Authorization:'Bearer '+randomBytes(32).toString('hex')},signal:AbortSignal.timeout(15000)});
            const isolatedData=await isolated.json();
            sync={anonymousStatus:anonymous.status,isolatedWorkspaceStatus:isolated.status,isolatedRecords:Object.keys(isolatedData.records||{}).length};
          }catch(error){sync={error:String(error)}}
          try{
            const response=await fetch(base+'api/review-notes',{signal:AbortSignal.timeout(15000)});
            const data=await response.json();
            const probeResponse=await fetch(base+'api/review-notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'probe'}),signal:AbortSignal.timeout(15000)});
            const probeData=await probeResponse.json();
            notes={status:response.status,schema:data.schema,count:Array.isArray(data.notes)?data.notes.length:null,probeStatus:probeResponse.status,probe:probeData.probe===true};
          }catch(error){notes={error:String(error)}}
          const report={commit:process.env.GITHUB_SHA,checkedAt:new Date().toISOString(),assetsMatch:matched,results,sync,notes};
          fs.writeFileSync('/tmp/odyssey-production-check/production.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!matched||sync.anonymousStatus!==401||sync.isolatedWorkspaceStatus!==200||notes.status!==200||notes.schema!=='odyssey-review-notes/v1'||notes.probeStatus!==200||notes.probe!==true)process.exitCode=1;
          NODE
      - name: Capture live Odyssey review notes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response=await fetch('https://kliawota.design/mtgtools/odyssey/api/review-notes',{signal:AbortSignal.timeout(15000)});
          if(!response.ok)throw new Error('Review notes returned HTTP '+response.status);
          const data=await response.json();
          if(data.schema!=='odyssey-review-notes/v1'||!Array.isArray(data.notes))throw new Error('Unexpected review-notes response');
          fs.mkdirSync('/tmp/odyssey-production-check',{recursive:true});
          fs.writeFileSync('/tmp/odyssey-production-check/review-notes.json',JSON.stringify({capturedAt:new Date().toISOString(),notes:data.notes},null,2));
          console.log('Captured '+data.notes.length+' Odyssey review-note record(s).');
          NODE
      - name: Resolve actioned Odyssey Studio notes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const targetIds=new Set(['ODY-008','ODY-015','ODY-017','ODY-020','ODY-021','ODY-023','ODY-036','ODY-037','ODY-046','ODY-047','ODY-049','ODY-051','ODY-056','ODY-057','ODY-063','ODY-067','ODY-069','ODY-073','ODY-074','ODY-077','ODY-078','ODY-079','ODY-084','ODY-085','ODY-087','ODY-092','ODY-093','ODY-094']);
          const captured=JSON.parse(fs.readFileSync('/tmp/odyssey-production-check/review-notes.json','utf8'));
          const pending=(captured.notes||[]).filter(note=>targetIds.has(note.cardId)&&note.status==='OPEN');
          for(const note of pending){
            const response=await fetch('https://kliawota.design/mtgtools/odyssey/api/review-notes',{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({action:'status',datasetVersion:note.datasetVersion,cardId:note.cardId,number:note.number,name:note.name,status:'RESOLVED'}),
              signal:AbortSignal.timeout(15000)
            });
            const body=await response.json();
            if(!response.ok||body.schema!=='odyssey-review-notes/v1'||body.note?.status!=='RESOLVED')throw new Error('Could not resolve '+note.cardId+': '+JSON.stringify(body));
          }
          const check=await fetch('https://kliawota.design/mtgtools/odyssey/api/review-notes',{signal:AbortSignal.timeout(15000)});
          const current=await check.json();
          const remaining=(current.notes||[]).filter(note=>targetIds.has(note.cardId)&&note.status==='OPEN');
          if(remaining.length)throw new Error('Actioned Studio notes still open: '+remaining.map(note=>note.cardId+'@'+note.datasetVersion).join(', '));
          console.log('Resolved '+pending.length+' actioned Odyssey Studio note record(s); target queue is clear.');
          NODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production browser and image verification tools
        run: |
          pip install requests pillow playwright
          python -m playwright install --with-deps chromium
      - name: Verify live Odyssey notes UI and same-origin write path
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          url='https://kliawota.design/mtgtools/odyssey/'
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={'width':390,'height':844})
              page.goto(url,wait_until='domcontentloaded',timeout=60000)
              page.wait_for_selector('#odNotesQueue',timeout=60000)
              page.click('#odNotesQueue')
              page.wait_for_selector('[data-note-add-current]',state='visible',timeout=10000)
              label=page.locator('[data-note-add-current]').inner_text()
              assert label.startswith('Add note to '), label
              page.wait_for_function("""() => {
                const el=document.querySelector('[data-note-queue-state]');
                return el && (/Connected/.test(el.textContent) || /Could not reach/.test(el.textContent));
              }""",timeout=15000)
              state=page.locator('[data-note-queue-state]').inner_text()
              assert state.startswith('Connected'), state
              probe=page.evaluate("""async () => {
                const r=await fetch('/mtgtools/odyssey/api/review-notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'probe'})});
                return {status:r.status,data:await r.json()};
              }""")
              assert probe['status']==200 and probe['data'].get('probe') is True, probe
              browser.close()
          PY
      - name: Verify deployed artwork and general editing
        run: python scripts/odyssey-production-artwork.py
      - name: Verify live text, locale art and Remove/Recast controls
        env:
          AUDIT_URL: https://kliawota.design/mtgtools/odyssey/
          AUDIT_OUT: /tmp/odyssey-production-refinement
        run: python scripts/odyssey-refinement-browser.py
      - name: Verify live full-authoring safe push interface
        env:
          AUDIT_URL: https://kliawota.design/mtgtools/odyssey/
        run: python scripts/odyssey-sheet-editor-browser.py
      - name: Verify Scryfall reference coverage, images, Oracle text and review state
        env:
          AUDIT_URL: https://kliawota.design/mtgtools/odyssey/
        run: python scripts/odyssey-reference-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-production-verification
          path: |
            /tmp/odyssey-production-check
            /tmp/odyssey-production-artwork
            /tmp/odyssey-production-refinement
            /tmp/odyssey-sheet-editor
            /tmp/odyssey-reference-cards
          retention-days: 7
