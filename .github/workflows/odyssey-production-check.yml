name: Odyssey production verification
on:
  push:
    branches: [main]
    paths:
      - 'public/mtgtools/odyssey/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'scripts/odyssey-production-artwork.py'
      - 'scripts/odyssey-refinement-browser.py'
      - 'scripts/odyssey-sheet-editor-browser.py'
      - 'scripts/odyssey-reference-browser.py'
      - '.github/workflows/odyssey-production-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odyssey-production-verification
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed source bytes and isolated sync endpoint
        run: |
          mkdir -p /tmp/odyssey-production-check
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash,randomBytes} from 'node:crypto';
          const base='https://kliawota.design/mtgtools/odyssey/';
          const files=['index.html','app.html','card-sheet-editor.js','card-reference-browser.js','design-refinement.js','studio-polish.js','studio-polish.css','data/card-references.json','data/card-references.js','data/odyssey-data.json','data/odyssey-data.js','data/odyssey-analysis-candidate-v1.json','data/release.json'];
          const hash=text=>createHash('sha256').update(text).digest('hex');
          let results=[],matched=false;
          for(let attempt=1;attempt<=60;attempt++){
            results=await Promise.all(files.map(async file=>{
              try{
                const response=await fetch(base+file+'?verify='+process.env.GITHUB_SHA+'-'+attempt,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
                const text=await response.text();
                const result={file,status:response.status,sameAsRepository:response.ok&&hash(text)===hash(fs.readFileSync('public/mtgtools/odyssey/'+file,'utf8'))};
                if(file==='data/release.json'&&response.ok){const release=JSON.parse(text);result.version=release.version;result.cards=release.cards;result.artworks=release.artworks;result.appRevision=release.appRevision;result.referenceCards=release.referenceCards;}
                return result;
              }catch(error){return {file,error:String(error)}}
            }));
            matched=results.every(result=>result.sameAsRepository);
            console.log(JSON.stringify({attempt,matched}));
            if(matched)break;
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          let sync;
          try{
            const anonymous=await fetch(base+'api/art-sync',{signal:AbortSignal.timeout(15000)});
            const isolated=await fetch(base+'api/art-sync',{headers:{Authorization:'Bearer '+randomBytes(32).toString('hex')},signal:AbortSignal.timeout(15000)});
            const isolatedData=await isolated.json();
            sync={anonymousStatus:anonymous.status,isolatedWorkspaceStatus:isolated.status,isolatedRecords:Object.keys(isolatedData.records||{}).length};
          }catch(error){sync={error:String(error)}}
          const report={commit:process.env.GITHUB_SHA,checkedAt:new Date().toISOString(),assetsMatch:matched,results,sync};
          fs.writeFileSync('/tmp/odyssey-production-check/production.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!matched||sync.anonymousStatus!==401||sync.isolatedWorkspaceStatus!==200)process.exitCode=1;
          NODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production browser and image verification tools
        run: |
          pip install requests pillow playwright
          python -m playwright install --with-deps chromium
      - name: Verify deployed artwork and general editing
        run: python scripts/odyssey-production-artwork.py
      - name: Verify live text, locale art and Remove/Recast controls
        env:
          AUDIT_URL: https://kliawota.design/mtgtools/odyssey/
          AUDIT_OUT: /tmp/odyssey-production-refinement
        run: python scripts/odyssey-refinement-browser.py
      - name: Verify live full-authoring safe push interface
        env:
          AUDIT_URL: https://kliawota.design/mtgtools/odyssey/
        run: python scripts/odyssey-sheet-editor-browser.py
      - name: Verify Scryfall reference coverage, images, Oracle text and review state
        env:
          AUDIT_URL: https://kliawota.design/mtgtools/odyssey/
        run: python scripts/odyssey-reference-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-production-verification
          path: |
            /tmp/odyssey-production-check
            /tmp/odyssey-production-artwork
            /tmp/odyssey-production-refinement
            /tmp/odyssey-sheet-editor
            /tmp/odyssey-reference-cards
          retention-days: 7
