name: Prepare Odyssey full-art basics
on:
  push:
    branches: ['codex/odyssey-ff-basic-lands']
permissions:
  contents: write
concurrency:
  group: prepare-odyssey-full-art-basics
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/odyssey-ff-basic-lands
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded source changes and regenerate shared renderer
        run: |
          node scripts/implement-full-art-basics.cjs
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          node scripts/build-odyssey-public-renderer.cjs
          node scripts/build-odyssey-public-renderer.cjs --check
          node --test tests/odyssey-full-art-basics.test.cjs
      - name: Install browser test dependency
        run: |
          python -m pip install -q playwright==1.57.0
          python -m playwright install --with-deps chromium > /tmp/browser-install.log 2>&1 || { tail -60 /tmp/browser-install.log; exit 1; }
      - name: Verify native renderer in browser
        run: |
          mkdir -p test-results/odyssey-full-art-basics
          python -m http.server 8765 --directory public > /tmp/odyssey-basics-http.log 2>&1 &
          python -u tests/odyssey-full-art-basics-browser.py 2>&1 | tee test-results/odyssey-full-art-basics/browser.log
      - name: Commit only verified feature sources; remove one-time preparation
        run: |
          git add public/mtgtools/odyssey/frame-system.js public/mtgtools/odyssey/frame-system.css public/mtgtools/odyssey/index.html public/mtgtools/odyssey/public-renderer.generated.js scripts/build-odyssey-public-renderer.cjs
          git rm scripts/implement-full-art-basics.cjs .github/workflows/odyssey-full-art-basics-prepare.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement optional FF-style full-art basic lands across Studio and public renderer'
          git push origin HEAD:codex/odyssey-ff-basic-lands
      - name: Preserve source and visual diagnostics
        if: always()
        run: |
          mkdir -p test-results/odyssey-full-art-basics
          git diff --stat > test-results/odyssey-full-art-basics/source-status.txt
          zip -q test-results/odyssey-full-art-basics/source-snapshot.zip public/mtgtools/odyssey/frame-system.js public/mtgtools/odyssey/frame-system.css public/mtgtools/odyssey/studio-polish.js public/mtgtools/odyssey/studio-polish.css public/mtgtools/odyssey/app.html public/mtgtools/odyssey/index.html scripts/build-odyssey-public-renderer.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-full-art-basics-preparation-proof
          path: test-results/odyssey-full-art-basics/
