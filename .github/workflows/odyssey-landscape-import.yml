name: Odyssey landscape import
on:
  push:
    branches: [main]
    paths:
      - 'scripts/odyssey-landscape-finalize-acquisition.py'
      - '.github/workflows/odyssey-landscape-import.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: odyssey-landscape-import
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse completed source acquisition
        uses: actions/download-artifact@v4
        with:
          name: odyssey-landscape-import
          run-id: 36527787605
          github-token: ${{ github.token }}
          path: landscape-import-output
      - name: Install image decoding dependencies
        run: pip install requests beautifulsoup4 Pillow
      - name: Acquire object-specific oil-study images from cached source pages
        run: python scripts/odyssey-landscape-finalize-acquisition.py
      - name: Retain completed acquisition and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-landscape-import
          path: landscape-import-output/
          retention-days: 7
