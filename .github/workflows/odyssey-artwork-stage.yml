name: Odyssey artwork optimization staging
on:
  push:
    branches: [odyssey/artwork-performance-20260919]
    paths:
      - '.github/workflows/odyssey-artwork-stage.yml'
      - 'scripts/odyssey-*'
      - 'tests/odyssey-artwork*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odyssey-artwork-optimization-stage
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  artwork-audit:
    if: github.ref == 'refs/heads/odyssey/artwork-performance-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inspection and browser tools
        run: |
          pip install requests pillow playwright
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/odyssey-artwork-audit /tmp/odyssey-browser-audit
      - name: Verify all default card assignments and documented source exception
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('public/mtgtools/odyssey/data')
          m=json.loads((d/'artwork-manifest.json').read_text())
          assert m['summary']['unavailable']==['ART-200'],m['summary']
          for name in ['odyssey-data.json','odyssey-analysis-candidate-v1.json']:
            cards=json.loads((d/name).read_text())['cards']
            assert all(m['artworks'][c['primaryArt']]['status']=='verified' for c in cards)
          PY
      - name: Finalize catalogue routing and desktop header layout
        run: python scripts/odyssey-performance-finalize.py | tee /tmp/odyssey-artwork-audit/performance.log
      - name: All unit and continuity regressions
        run: node --test tests/*.test.cjs tests/*.test.js | tee /tmp/odyssey-artwork-audit/tests.txt
      - name: Decode every image and verify new selections survive browser reload
        run: |
          python -m http.server 8787 --directory public > /tmp/odyssey-artwork-audit/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python scripts/odyssey-browser-audit.py | tee /tmp/odyssey-browser-audit/result.log
      - name: Verify complete Worker build without deploying
        run: |
          npm install --no-package-lock
          npx wrangler deploy --dry-run --outdir /tmp/odyssey-verified-build | tee /tmp/odyssey-artwork-audit/build.log
      - name: Commit verified final fixes to staging only
        run: |
          git diff --exit-code -- public/mtgtools/odyssey/data/odyssey-data.json public/mtgtools/odyssey/data/odyssey-data.js public/mtgtools/odyssey/data/odyssey-analysis-candidate-v1.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mtgtools/odyssey/app.html tests/odyssey-artwork-delivery.test.cjs scripts/odyssey-browser-audit.py
          git add -u public/mtgtools/odyssey/data
          git diff --cached --stat > /tmp/odyssey-artwork-audit/changes.txt
          git diff --cached --quiet || git commit -m 'Preserve saved artwork selections through optimized delivery and contain toolbar'
          git push origin HEAD:refs/heads/odyssey/artwork-performance-20260919
          git rev-parse HEAD > /tmp/odyssey-artwork-audit/staged-commit.txt
      - name: Package diagnostics and rendered previews
        if: always()
        run: |
          mkdir -p /tmp/odyssey-artwork-audit
          tar --exclude='public/mtgtools/odyssey/assets/artwork' -czf /tmp/odyssey-artwork-audit/source.tgz public src tests scripts package.json wrangler.jsonc .github
          cp public/mtgtools/odyssey/data/artwork-manifest.json /tmp/odyssey-artwork-audit/artwork-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-artwork-audit
          path: |
            /tmp/odyssey-artwork-audit
            /tmp/odyssey-browser-audit
          retention-days: 7
