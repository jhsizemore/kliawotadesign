name: Odyssey artwork optimization staging
on:
  push:
    branches: [odyssey/artwork-performance-20260919]
    paths: ['.github/workflows/odyssey-artwork-stage.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odyssey-artwork-optimization-stage
  cancel-in-progress: true
jobs:
  artwork-audit:
    if: github.ref == 'refs/heads/odyssey/artwork-performance-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image inspection tools
        run: pip install requests pillow
      - name: Recover the remaining exact artwork sources
        run: python scripts/odyssey-artwork-recover.py | tee /tmp/odyssey-artwork-log.txt
      - name: Commit verified image assets to staging only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mtgtools/odyssey/assets/artwork public/mtgtools/odyssey/data/artwork-manifest.json
          git diff --cached --quiet || git commit -m 'Recover missing exact artwork sources with native resolution and provenance'
          git push origin HEAD:refs/heads/odyssey/artwork-performance-20260919
          git rev-parse HEAD > /tmp/odyssey-artwork-audit/staged-commit.txt
      - name: Package source and diagnostics
        if: always()
        run: |
          mkdir -p /tmp/odyssey-artwork-audit
          cp /tmp/odyssey-artwork-log.txt /tmp/odyssey-artwork-audit/ 2>/dev/null || true
          tar --exclude='public/mtgtools/odyssey/assets/artwork' -czf /tmp/odyssey-artwork-audit/source.tgz public src tests scripts package.json wrangler.jsonc .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-artwork-audit
          path: /tmp/odyssey-artwork-audit
          retention-days: 7
