name: Odyssey showcase source check
on:
  push:
    branches: [odyssey-rules-and-contact]
    paths: ['.github/workflows/odyssey-showcase-integrate.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package source and existing flagship artwork for visual inspection
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          roots=['public/mtgtools/odyssey','public/mtgtools/Odyssey/scry','src','scripts','tests','.github/workflows']
          with zipfile.ZipFile('showcase-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root in roots:
                  for p in Path(root).rglob('*'):
                      if not p.is_file(): continue
                      source=p.suffix in {'.html','.js','.json','.css','.mjs','.cjs','.py','.md','.yml','.ts'} and p.stat().st_size<10000000
                      asset=('/assets/brand/' in str(p) or '/assets/mana-pips/' in str(p) or p.suffix in {'.woff','.woff2'} or (p.name.startswith('ART-162.') and p.suffix=='.webp'))
                      if source or asset:z.write(p)
              for n in ['package.json','wrangler.jsonc']:
                  if Path(n).exists():z.write(n)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: odyssey-showcase-source-current
          path: showcase-source.zip
          retention-days: 3
