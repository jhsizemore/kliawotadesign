name: Port Vila storefront verification
on:
  push:
    branches: [port-vila-storefront-survey-2026-09-29]
    paths: ['.github/workflows/port-vila-storefront-survey.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: port-vila-storefront-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          npm install --no-save --package-lock=false three@0.180.0 playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Build and run geometry and retained stability tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/storefront-check
          python3 scripts/build-port-vila-storefronts.py | tee evidence/storefront-check/build.json
          node --check public/portvilasandbox/assets/index-storefront-1.js
          node --test tests/port-vila-storefronts.test.mjs | tee evidence/storefront-check/unit-tests.txt
          python3 scripts/port-vila-stability-build.py
          node --test tests/port-vila-stability.test.mjs | tee evidence/storefront-check/stability-tests.txt
          git diff --exit-code -- public/portvilasandbox/data/world.json public/portvilasandbox/data/north-v1 public/portvilasandbox/assets/index-iSZdlO1J.js
      - name: Inspect actual desktop and mobile-viewport renders
        shell: bash
        run: |
          python3 -m http.server 8765 --directory public >/tmp/port-vila-http.log 2>&1 &
          node scripts/check-port-vila-storefronts.mjs
      - name: Commit tested release only to the isolated branch
        if: success() && github.ref == 'refs/heads/port-vila-storefront-survey-2026-09-29'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/portvilasandbox/BUILD.json public/portvilasandbox/index.html
          git add public/portvilasandbox/assets/index-storefront-1.js public/portvilasandbox/assets/research-storefront-1.js public/portvilasandbox/assets/research-data-storefront-1.js public/portvilasandbox/assets/vision-storefront-1.js
          git diff --cached --quiet || git commit -m 'Build verified partial Fung Kuei and Aircalin photo-reference pass'
          git push origin HEAD:port-vila-storefront-survey-2026-09-29
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-vila-storefront-verification
          path: evidence/storefront-check/
          retention-days: 7
