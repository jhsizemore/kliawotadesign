name: Port Vila storefront source inspection
on:
  push:
    branches: [port-vila-storefront-survey-2026-09-29]
    paths: ['.github/workflows/port-vila-storefront-survey.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover published research images and primary download links
        shell: bash
        run: |
          mkdir -p inspection/references
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          from urllib.request import urlopen,Request
          from urllib.parse import urljoin
          from html.parser import HTMLParser
          import json,shutil
          out=Path('inspection/references'); manifest=[]
          for p in Path('public/portvilasandbox/research').rglob('*.webp'):
              dest=out/p.name; shutil.copyfile(p,dest)
              im=Image.open(p).convert('RGB'); im.thumbnail((1600,1200)); im.save(out/(p.stem+'-preview.jpg'),quality=90)
              manifest.append({'file':p.name,'source':str(p),'pixels':list(Image.open(p).size),'scope':'Existing published DUAP report page, historical reference only'})
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      d=dict(attrs)
                      if d.get('href'): self.links.append(d['href'])
          pages=[]
          for url in ['https://duap.gov.vu/','http://duap.gov.vu/','https://www.vanuatu.travel/en/port-vila-update-july-2025']:
              try:
                  req=Request(url,headers={'User-Agent':'PortVilaSandbox-source-review/1.0'})
                  with urlopen(req,timeout=20) as res: text=res.read(4000000).decode('utf-8','replace')
                  parser=Links(); parser.feed(text)
                  links=[urljoin(url,x) for x in parser.links if any(t in x.lower() for t in ['.rar','.zip','.pdf','july','photo'])]
                  pages.append({'url':url,'links':links})
                  (out/f'page-{len(pages)}.html').write_text(text)
                  print(url,json.dumps(links))
              except Exception as e: pages.append({'url':url,'error':str(e)}); print(url,str(e))
          (out/'download-links.json').write_text(json.dumps(pages,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-vila-storefront-reference-images
          path: inspection/
          retention-days: 3
