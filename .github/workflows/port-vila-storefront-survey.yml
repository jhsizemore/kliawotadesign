name: Port Vila storefront source inspection
on:
  push:
    branches: [port-vila-storefront-survey-2026-09-29]
    paths: ['.github/workflows/port-vila-storefront-survey.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Follow current primary-source download links
        shell: bash
        run: |
          mkdir -p inspection/references inspection/model/assets
          cp public/portvilasandbox/assets/vila-kit.glb inspection/model/assets/
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen,Request
          from urllib.parse import urljoin,urlparse,unquote,quote
          from html.parser import HTMLParser
          import json,hashlib
          out=Path('inspection/references'); pages=[]; downloads=[]; seen=set()
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='a' and d.get('href'): self.links.append(d['href'])
          urls=['https://duap.gov.vu/index.php/projects/planning-frameworks-and-policies/port-vila-cbd-vision-and-concept-plan','https://duap.gov.vu/index.php/projects-urban-resilience/port-vila-cbd-redevelopment-plan-project/port-vila-cbd-recovery-and-rebuild']
          for url in urls:
              try:
                  with urlopen(Request(url,headers={'User-Agent':'PortVilaSandbox-source-review/1.0'}),timeout=25) as res: text=res.read(4000000).decode('utf-8','replace')
                  parser=Links(); parser.feed(text); links=[urljoin(url,x) for x in parser.links]
                  pages.append({'url':url,'links':links}); (out/f'page-{len(pages)}.html').write_text(text)
                  print(url,json.dumps(links))
                  for target in links:
                      target=quote(target,safe=':/?=&%+#'); suffix=Path(urlparse(target).path).suffix.lower()
                      if suffix not in ['.rar','.zip','.pdf'] or target in seen or len(downloads)>=5: continue
                      if urlparse(target).hostname not in ['duap.gov.vu','www.duap.gov.vu']: continue
                      seen.add(target); name=unquote(Path(urlparse(target).path).name)
                      try:
                          with urlopen(Request(target,headers={'User-Agent':'PortVilaSandbox-source-review/1.0'}),timeout=45) as res:
                              data=res.read(157286401)
                          if len(data)>157286400: raise ValueError('Reference exceeds 150 MiB inspection limit')
                          dest=out/(str(len(downloads))+'-'+name); dest.write_bytes(data)
                          downloads.append({'url':target,'file':dest.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
                      except Exception as e: downloads.append({'url':target,'error':str(e)})
              except Exception as e: pages.append({'url':url,'error':str(e)}); print(url,str(e))
          (out/'download-links.json').write_text(json.dumps({'pages':pages,'downloads':downloads},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-vila-primary-references-and-kit
          path: inspection/
          retention-days: 3
