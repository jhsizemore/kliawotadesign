name: Odyssey release staging
on:
  push:
    branches: [odyssey/release-20260919]
    paths:
      - '.github/workflows/odyssey-release-stage.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odyssey-release-stage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/odyssey/release-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reconciled candidate and production assets
        run: |
          mkdir -p /tmp/odyssey-release-audit
          node scripts/odyssey-release.cjs | tee /tmp/odyssey-release-audit/release-generation.json
      - name: Test all artwork, mobile, continuity and release regressions
        run: node --test tests/*.test.cjs tests/*.test.js | tee /tmp/odyssey-release-audit/continuity.txt
      - name: Verify repeatable generation
        run: |
          sha256sum public/mtgtools/odyssey/data/*.json public/mtgtools/odyssey/data/*.js public/mtgtools/odyssey/app.html public/mtgtools/odyssey/index.html > /tmp/odyssey-before.sha
          node scripts/odyssey-release.cjs > /dev/null
          sha256sum public/mtgtools/odyssey/data/*.json public/mtgtools/odyssey/data/*.js public/mtgtools/odyssey/app.html public/mtgtools/odyssey/index.html > /tmp/odyssey-after.sha
          diff -u /tmp/odyssey-before.sha /tmp/odyssey-after.sha
      - name: Install existing build dependencies
        run: npm install --no-package-lock
      - name: Verify Worker build without deployment
        run: npx wrangler deploy --dry-run --outdir /tmp/odyssey-verified-build | tee /tmp/odyssey-release-audit/build.txt
      - name: Commit verified generated files only to isolated release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/odyssey-release-stage.yml
          git add public/mtgtools/odyssey/data/odyssey-analysis-candidate-v1.json public/mtgtools/odyssey/data/odyssey-data.json public/mtgtools/odyssey/data/odyssey-data.js public/mtgtools/odyssey/data/release.json public/mtgtools/odyssey/app.html public/mtgtools/odyssey/index.html tests/odyssey-continuity.test.cjs tests/odyssey-mobile-navigation.test.js .github/workflows/odyssey-continuity.yml
          git diff --cached --stat > /tmp/odyssey-release-audit/changes.txt
          git diff --cached --quiet || git commit -m 'Release Odyssey song cycles with preserved artwork and verified data audits'
          git push origin HEAD:refs/heads/odyssey/release-20260919
          git rev-parse HEAD > /tmp/odyssey-release-audit/verified-commit.txt
          tar -czf /tmp/odyssey-release-audit/source.tgz public src tests scripts package.json wrangler.jsonc .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-release-audit
          path: /tmp/odyssey-release-audit
          retention-days: 3
