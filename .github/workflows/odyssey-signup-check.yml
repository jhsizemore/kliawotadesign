name: Odyssey candidate and email signup verification
on:
  push:
    branches: [main, odyssey-candidates-crops-signup]
    paths:
      - 'src/odyssey-*.mjs'
      - 'src/odyssey-worker.js'
      - 'public/mtgtools/Odyssey/scry/**'
      - 'public/mtgtools/odyssey/**'
      - 'scripts/build-odyssey-*.cjs'
      - 'tests/odyssey-signup*'
      - 'tests/odyssey-subscriptions*'
      - '.github/workflows/odyssey-signup-check.yml'
  pull_request:
    paths:
      - 'src/odyssey-*'
      - 'public/mtgtools/Odyssey/scry/**'
      - 'public/mtgtools/odyssey/**'
      - 'scripts/build-odyssey-*.cjs'
      - 'tests/odyssey-signup*'
      - 'tests/odyssey-subscriptions*'
      - '.github/workflows/odyssey-signup-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odyssey-signup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source, candidates and subscriber protocol
        run: |
          set -o pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/build-odyssey-public-renderer.cjs --check
          mkdir -p test-results/odyssey-signup
          node --test tests/odyssey-subscriptions.test.mjs tests/odyssey-candidate-source.test.cjs tests/odyssey-placement.test.cjs | tee test-results/odyssey-signup/unit-tests.txt
      - name: Test the actual Cloudflare Worker and private Durable Object
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 --persist-to /tmp/odyssey-signup-isolated >/tmp/odyssey-workerd.log 2>&1 &
          node tests/odyssey-subscriptions-runtime.mjs || { tail -100 /tmp/odyssey-workerd.log; exit 1; }
      - name: Test all slide placements, author isolation and real form submission
        run: |
          python -m pip install -q playwright==1.57.0
          python -m playwright install --with-deps chromium >/tmp/browser-install.log 2>&1 || { tail -60 /tmp/browser-install.log; exit 1; }
          node tests/odyssey-signup-server.mjs >/tmp/odyssey-signup-server.log 2>&1 &
          python -u tests/odyssey-signup-browser.py
      # Production bytes and public service configuration are checked after the
      # matching Cloudflare build in odyssey-delivery-check.yml.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-signup-verification
          path: test-results/odyssey-signup/
          if-no-files-found: ignore
