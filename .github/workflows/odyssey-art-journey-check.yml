name: Odyssey art journey verification
on:
  push:
    branches: [main, odyssey-art-journey]
    paths:
      - 'public/mtgtools/Odyssey/scry/**'
      - 'tests/odyssey-art-journey.py'
      - 'tests/odyssey-launch.py'
      - '.github/workflows/odyssey-art-journey-check.yml'
  pull_request:
    paths:
      - 'public/mtgtools/Odyssey/scry/**'
      - 'tests/odyssey-art-journey.py'
      - 'tests/odyssey-launch.py'
      - '.github/workflows/odyssey-art-journey-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odyssey-art-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check published data and native renderer source parity
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/build-odyssey-public-renderer.cjs --check
          node tests/odyssey-exhibition.cjs
      - name: Install test browser
        run: |
          python -m pip install -q playwright==1.57.0
          python -m playwright install --with-deps chromium > /tmp/art-journey-browser-install.log 2>&1 || { tail -60 /tmp/art-journey-browser-install.log; exit 1; }
      - name: Verify release identity and curated presentation with real images
        run: |
          python -m http.server 8765 --directory public > /tmp/art-journey-server.log 2>&1 &
          python -u tests/odyssey-launch.py
          python -u tests/odyssey-art-journey.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-art-journey-visual-checks
          path: test-results/odyssey-art-journey/
          if-no-files-found: ignore
          retention-days: 14
