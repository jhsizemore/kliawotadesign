name: Odyssey focused launch integration
on:
  push:
    branches: [odyssey-focused-launch]
    paths:
      - '.github/workflows/odyssey-launch-source.yml'
      - 'scripts/focus-odyssey-launch.py'
      - 'scripts/finalize-focused-launch.py'
      - 'public/mtgtools/Odyssey/scry/focused-launch.*'
      - 'tests/odyssey-focused-launch.py'
permissions:
  contents: write
concurrency:
  group: focused-launch-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: |
          python -m pip install -q beautifulsoup4 playwright==1.57.0
          python -m playwright install --with-deps chromium >/tmp/browser-install.log 2>&1 || { tail -60 /tmp/browser-install.log; exit 1; }
      - name: Prepare focused landing without editing canonical data
        run: |
          python scripts/focus-odyssey-launch.py
          python scripts/finalize-focused-launch.py
          node --check public/mtgtools/Odyssey/scry/focused-launch.js
          node --check public/mtgtools/Odyssey/scry/exhibition.js
          node scripts/build-odyssey-public-renderer.cjs --check
          node tests/odyssey-exhibition.cjs
          node --test tests/odyssey-placement.test.cjs
      - name: Verify launch, extended exhibition and social tools
        run: |
          python -m http.server 8765 --directory public >/tmp/launch-http.log 2>&1 &
          python -u tests/odyssey-focused-launch.py
          python -u tests/odyssey-exhibition-browser.py
      - name: Save real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-focused-launch-review
          path: |
            test-results/odyssey-focused-launch/
            test-results/odyssey-exhibition/
          if-no-files-found: ignore
      - name: Commit verified migration to the feature branch only
        run: |
          test "$(git ls-remote origin refs/heads/odyssey-focused-launch | cut -f1)" = "${{ github.sha }}"
          git config user.name 'Odyssey launch integration'
          git config user.email 'actions@users.noreply.github.com'
          git add public/mtgtools/Odyssey/scry/index.html public/mtgtools/Odyssey/scry/art.html public/mtgtools/Odyssey/scry/launch.css public/mtgtools/Odyssey/scry/exhibition.js public/mtgtools/Odyssey/scry/social/index.html public/mtgtools/Odyssey/scry/focused-launch.js public/mtgtools/Odyssey/scry/focused-launch.css tests/odyssey-exhibition-browser.py
          if ! git diff --cached --quiet; then
            git commit -m 'Finish continuous Sirens composition and Troy-to-Ithaca spotlight'
            git push origin HEAD:odyssey-focused-launch
          fi
