name: Odyssey readiness source inspection
on:
  push:
    branches: [odyssey-launch-readiness]
    paths: ['.github/workflows/odyssey-readiness-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture source and complete existing regressions
        run: |
          mkdir -p test-results/readiness
          node --test --test-reporter=tap tests/*.test.cjs tests/*.test.js >test-results/readiness/baseline.tap 2>&1 || true
          python - <<'PY'
          from pathlib import Path
          import zipfile,json,subprocess
          out=Path('test-results/readiness')
          roots=['public/mtgtools/odyssey','public/mtgtools/Odyssey/scry','tests','scripts','src','.github/workflows']
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root in roots:
                  for p in Path(root).rglob('*'):
                      if not p.is_file():continue
                      text=p.suffix in {'.js','.cjs','.mjs','.html','.json','.css','.py','.md','.yml','.ts'} and p.stat().st_size<14000000
                      image=(p.name.endswith('.thumb.webp') or '/assets/brand/' in str(p) or '/assets/mana-pips/' in str(p))
                      font=p.suffix in {'.woff','.woff2'}
                      if text or image or font:z.write(p)
              for n in ['package.json','package-lock.json','wrangler.jsonc','wrangler.toml']:
                  if Path(n).exists():z.write(n)
          (out/'revision.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          print((out/'source.zip').stat().st_size,'source bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: odyssey-readiness-baseline
          path: test-results/readiness/
          retention-days: 3
