name: Odyssey epic website integration
on:
  push:
    branches: [odyssey-working-rules-and-artifact]
    paths: ['scripts/integrate-odyssey-epic.py','public/mtgtools/Odyssey/scry/set-showcase.js','public/mtgtools/Odyssey/scry/epic-refinements.css','tests/odyssey-epic-browser.py','.github/workflows/odyssey-epic-integration.yml']
permissions:
  contents: write
concurrency:
  group: odyssey-epic-site-integration
  cancel-in-progress: true
jobs:
  epic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: odyssey-working-rules-and-artifact
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate only presentation code
        run: |
          python scripts/integrate-odyssey-epic.py
          node --check public/mtgtools/Odyssey/scry/set-showcase.js
          node --check public/mtgtools/Odyssey/scry/focused-launch.js
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/build-odyssey-public-renderer.cjs --check
          node --test tests/odyssey-contact.test.mjs tests/odyssey-placement.test.cjs tests/odyssey-exhibition.cjs
      - name: Install browser checks
        run: |
          python -m pip install -q pillow playwright==1.57.0
          python -m playwright install --with-deps chromium >/tmp/browser-install.log 2>&1 || { tail -60 /tmp/browser-install.log; exit 1; }
      - name: Check original screenshot pixels and every requested website change
        run: |
          python -m http.server 8765 --directory public >/tmp/epic-http.log 2>&1 &
          python -u tests/odyssey-epic-browser.py
          python -u tests/odyssey-fullart-paint.py
          python -u tests/odyssey-showcase-browser.py
          python -u tests/odyssey-focused-launch.py
          python -u tests/odyssey-exhibition-browser.py
      - name: Save actual browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-epic-website-review
          path: |
            test-results/odyssey-epic/
            test-results/odyssey-fullart-paint/
            test-results/odyssey-showcase/
            test-results/odyssey-focused-launch/
            test-results/odyssey-exhibition/
          if-no-files-found: ignore
      - name: Commit verified integration to this review branch
        run: |
          git config user.name 'Odyssey website integration'
          git config user.email 'actions@users.noreply.github.com'
          git add public/mtgtools/Odyssey/scry/index.html public/mtgtools/Odyssey/scry/focused-launch.js public/mtgtools/Odyssey/scry/set-showcase.js tests/odyssey-focused-launch.py
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate tilted native hero, real Odyssey fragment and working rules on Scry'
            git pull --rebase origin odyssey-working-rules-and-artifact
            git push origin HEAD:odyssey-working-rules-and-artifact
          fi
