name: Odyssey candidate crop and signup integration
on:
  push:
    branches: [odyssey-candidates-crops-signup]
    paths:
      - '.github/workflows/odyssey-signup-integrate.yml'
      - 'scripts/integrate-odyssey-signups.py'
      - 'scripts/build-odyssey-candidate.cjs'
      - 'src/odyssey-subscriptions.mjs'
      - 'public/mtgtools/Odyssey/scry/updates-signup.*'
      - 'public/mtgtools/Odyssey/scry/placement-sync.js'
      - 'tests/odyssey-signup*'
      - 'tests/odyssey-subscriptions*'
      - 'tests/odyssey-candidate-source*'
permissions:
  contents: write
concurrency:
  group: odyssey-signup-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build and browser tools
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          python -m pip install -q beautifulsoup4 pillow playwright==1.57.0
          python -m playwright install --with-deps chromium >/tmp/browser-install.log 2>&1 || { tail -60 /tmp/browser-install.log; exit 1; }
      - name: Integrate source without changing canonical card data
        run: |
          sha256sum public/mtgtools/odyssey/data/odyssey-data.js public/mtgtools/odyssey/data/odyssey-data.json public/mtgtools/odyssey/live-sheet-sync.js public/mtgtools/odyssey/live-sheet-art-patch.js >/tmp/canonical-before.sha
          python scripts/integrate-odyssey-signups.py
          node scripts/build-odyssey-public-renderer.cjs
          node scripts/build-odyssey-public-renderer.cjs --check
          sha256sum -c /tmp/canonical-before.sha
      - name: Test data equality, privacy, persistence and spreadsheet export
        run: |
          mkdir -p test-results/odyssey-signup
          node --test tests/odyssey-subscriptions.test.mjs tests/odyssey-candidate-source.test.cjs tests/odyssey-placement.test.cjs tests/odyssey-exhibition.cjs | tee test-results/odyssey-signup/unit-tests.txt
          npx wrangler deploy --dry-run --outdir /tmp/odyssey-signup-worker
      - name: Real-page browser verification
        run: |
          node tests/odyssey-signup-server.mjs >/tmp/signup-server.log 2>&1 &
          python -u tests/odyssey-signup-browser.py
          python -u tests/odyssey-epic-browser.py
          python -u tests/odyssey-exhibition-browser.py
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-signup-review
          path: |
            test-results/odyssey-signup/
            test-results/odyssey-epic/
            test-results/odyssey-exhibition/
          if-no-files-found: ignore
      - name: Commit verified integration on feature branch only
        run: |
          test "$(git ls-remote origin refs/heads/odyssey-candidates-crops-signup | cut -f1)" = "${{ github.sha }}"
          git config user.name 'Odyssey signup integration'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/build-odyssey-public-renderer.cjs src/odyssey-worker.js src/odyssey-sync.mjs public/mtgtools/odyssey/art-placement-core.js public/mtgtools/odyssey/art-placement-studio.js public/mtgtools/odyssey/app.html public/mtgtools/odyssey/index.html public/mtgtools/odyssey/public-renderer.generated.js public/mtgtools/odyssey/data/odyssey-public-candidate.json public/mtgtools/Odyssey/scry/exhibition.js public/mtgtools/Odyssey/scry/index.html public/mtgtools/Odyssey/scry/art.html public/mtgtools/Odyssey/scry/social/index.html tests/odyssey-focused-launch.py tests/odyssey-exhibition-browser.py tests/odyssey-showcase-browser.py tests/odyssey-placement-browser.py
          if ! git diff --cached --quiet; then
            git commit -m 'Use the current Studio candidate and save real email update signups'
            git push origin HEAD:odyssey-candidates-crops-signup
          fi
