name: Odyssey full Sheet editor staging
on:
  push:
    branches: [odyssey/full-sheet-editor-20260919]
    paths:
      - '.github/workflows/odyssey-sheet-editor-stage.yml'
      - 'public/mtgtools/odyssey/card-sheet-editor.js'
      - 'scripts/odyssey-sheet-editor-*'
      - 'tests/odyssey-sheet-editor*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: odyssey-sheet-editor-stage
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  verify:
    if: github.ref == 'refs/heads/odyssey/full-sheet-editor-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate full authoring fields into existing Studio override system
        run: python scripts/odyssey-sheet-editor-patch.py
      - name: Run all data, rendering, artwork and Sheet safety regressions
        run: node --test tests/*.test.cjs tests/*.test.js | tee /tmp/odyssey-sheet-editor-tests.txt
      - name: Install browser verification
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/odyssey-sheet-editor
      - name: Exercise full editor, safe write, read-back and conflict block on desktop and mobile
        run: |
          python -m http.server 8787 --directory public > /tmp/odyssey-sheet-editor/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python scripts/odyssey-sheet-editor-browser.py | tee /tmp/odyssey-sheet-editor/browser.log
      - name: Verify complete Worker build without deployment
        run: |
          npm install --no-package-lock
          npx wrangler deploy --dry-run --outdir /tmp/odyssey-sheet-editor-worker | tee /tmp/odyssey-sheet-editor/worker.log
      - name: Commit only verified generated integration files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mtgtools/odyssey/app.html public/mtgtools/odyssey/index.html public/mtgtools/odyssey/studio-polish.js public/mtgtools/odyssey/data/release.json
          git diff --cached --stat > /tmp/odyssey-sheet-editor/changes.txt
          git diff --cached --quiet || git commit -m 'Integrate full Card File editing and conflict-checked Sheet publishing'
          git push origin HEAD:refs/heads/odyssey/full-sheet-editor-20260919
          git rev-parse HEAD > /tmp/odyssey-sheet-editor/verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-sheet-editor-verification
          path: |
            /tmp/odyssey-sheet-editor
            /tmp/odyssey-sheet-editor-tests.txt
          retention-days: 7
