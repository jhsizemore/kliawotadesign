name: Odyssey checks
on:
  push:
    branches: [main, odyssey-v317-editor-continuity]
    paths:
      - 'public/mtgtools/odyssey/**'
      - 'src/**'
      - 'tests/**'
      - 'wrangler.jsonc'
      - '.github/workflows/odyssey-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: node --test tests/*.test.js tests/*.test.cjs
      - name: Retain exact tested Odyssey sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-tested-source
          retention-days: 3
          path: |
            public/mtgtools/odyssey/
            src/
            tests/
            package.json
            wrangler.jsonc
